<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preload" href="undertaledeltarunetextfontextended.woff2" as="font" type="font/woff2" crossorigin>
    <link href="https://fonts.cdnfonts.com/css/christmas-sparkle-personal-use" rel="stylesheet">
      <link rel="stylesheet" href="stylesheet.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAPPY BIRTHDAY!!</title>
</head>
<body>

    <img src="https://upload.wikimedia.org/wikipedia/commons/0/02/Television_static.gif" id="static">

 <img id="tenna-fright" class="sprite" src="https://i.ibb.co/TB8p61tZ/spr-tenna-frightened-4.png">
    <img id="tenna-laugh" class="sprite" src="https://i.postimg.cc/yNb9nsc2/ezgif-72f5557666bf96.gif">
    <img id="tenna-woo" class="sprite" src="https://i.ibb.co/MkzqKV6m/spr-tenna-hooray-3.png">
    <img id="tenna-pointup" class="sprite" src="https://i.ibb.co/qLLjmHx3/spr-tenna-point-up-0.png">
    <img id="tenna-turn" class="sprite" src="https://i.ibb.co/C5nhYbtj/spr-tenna-communication-0.png">
    <img id="tenna-kick" class="sprite" src="https://i.ibb.co/Y4LMLZrk/ezgif-1b5702004c7cb6.gif">
    <img id="tenna-point" class="sprite" src="https://i.ibb.co/TD6rx7kZ/ITSTVTIME.webp">
    <img id="tenna-dance" class="sprite" src="https://i.ibb.co/bj7v0BVB/PC-Computer-Deltarune-Tenna-Tenna-Dance.gif">
    <img id="tenna-smile" class="sprite" src="https://i.ibb.co/bMBrg3zn/spr-tenna-pose-podium-0.png">
    <img id="tenna-float" class="sprite" src="https://i.ibb.co/qLxkqmnr/spr-tenna-pose-0.png">
    <img id="tenna-present" class="sprite" src="https://i.ibb.co/BH1dFDc0/spr-tenna-pose-podium-4.png">
    <img id="tenna-shock" class="sprite" src="https://i.ibb.co/mVQSxrXW/Deltarune-Sprite-Tenna-Shocked-removebg-preview.png">
    <img id="tenna-sad" class="sprite" src="https://i.ibb.co/5gZ7F064/spr-tenna-desperate-3.png">
  <img id="tenna-silly" class="sprite" src="https://i.ibb.co/h1h269VX/Deltarune-Sprite-Tenna-Whisper.webp">

<img src="https://i.ibb.co/ksp7C7Pw/c2432654eed2c17af90129f20e484903-removebg-preview.png" id="television">

    <div id="bottom-container">
        <div id="textthing">
            <img src="https://i.ibb.co/RTQGkp5f/PC-Computer-Deltarune-User-Interface-HUD-w-trans.png" id="square">
            <p id="text"></p>
        </div>
        <button id="next">
            <img src="https://i.ibb.co/xqtSr8hF/hgfhgfhgfhgf.png" alt="Next">
        </button>
    </div>

<script>
    const dialog = [
        { 
            text: "Woah! That's one big TV!", 
            spriteId: "tenna-fright",
            highlightWords: [
                { word: "TV", font: "highlight" } 
            ]
        },
        { 
            text: "Heh… I thought I was OLD, but this guy takes the cake!!", 
            spriteId: "tenna-laugh",
            highlightWords: [
                { word: "OLD", font: "ancient" }
            ]
        },
        { 
            text: "Now, now… enough gawking at old TVs!", 
            spriteId: "tenna-woo",
        },
        { 
            text: " Time to focus on the main broadcast! It's showtime!", 
            spriteId: "tenna-pointup",
            highlightWords: [
                { word: "main", font: "highlight" }
            ]
        },
        { 
            text: "Lights, camera… YOU! The star of today's broadcast!", 
            spriteId: "tenna-point",
            highlightWords: [
                { word: "YOU", font: "highlight" }
            ]
        },
        { 
            text: "Uh-oh… was I not supposed to talk to you directly?", 
            spriteId: "tenna-turn",
        },
        { 
            text: "Ah, well… rules are boring anyway!", 
            spriteId: "tenna-laugh",
        },
        { 
            text: "All eyes on the birthday boy!", 
            spriteId: "tenna-point",
        },
        { 
            text: " An important broadcast just for you!", 
            spriteId: "tenna-dance",
            highlightWords: [
                { word: "you", font: "highlight" }
            ]
        },
        { 
            text: "It's not every day someone as special as you gets all the spotlight… but today, birthday boy, it's all yours!", 
            spriteId: "tenna-smile",
        },
        { 
            text: "Ahhh… how wonderful it is to be young and full of life!", 
            spriteId: "tenna-float",
            highlightWords: [
                { word: "wonderful", font: "highlight" }
            ]
        },
        { 
            text: "And now, live from the main channel… let's give it up for the birthday boy!", 
            spriteId: "tenna-point",
        },
        { 
            text: "And now… the moment you've been waiting for!", 
            spriteId: "tenna-woo",
        },
        { 
            text: "Your birthday message, right here on this dusty , old TV!", 
            spriteId: "tenna-present",
            highlightWords: [
                { word: "dusty", font: "ancient" },
                { word: "old", font: "ancient" }
            ]
        },
        { 
            text: "Wait! Don't get confused…i'm not the TV,just the TV host!", 
            spriteId: "tenna-shock",
        },
        { 
            text: "Could it be? Have I…become one of the classic models?", 
            spriteId: "tenna-sad",
        },
        { 
            text: "Heh, signal interruption over! Let's get back to the main broadcas! It's your special day!", 
            spriteId: "tenna-woo",
        },
        { 
            text: "Behold! Your best bro wrote you something! Just for you!", 
            spriteId: "tenna-present",
        },
        { 
            text: "Let's all cheer for this spectacular act of friendship! Wow, i'm getting all warm and fuzzy!", 
            spriteId: "tenna-float",
        },
        { 
            text: "And now, tuning in to my faithful companion: the dusty TV!", 
            spriteId: "tenna-silly",
        },
    ];

    const tvTextPages = [
        "HAPPY BIRTHDAY BRO!!!!! Ill start with the normal stuff and get into the sentimental stuff after. Cough cough. I hope you have the best birthday ever and i hope you get to spend it with you favorite people and with good food and good games!! I hope this age will be kind to you and that you'll achieve everything you want! I hope you'll have more relaxing,fun days and less stressful days! I also hope that you'll be doing better in terms of health,because i care about and love you lots,so i want to see you happy! You've got lots of amazing things in your future,but take it one step at a time! Take care of yourself bro!!!! I'm sad that i wasn't able to buy you something for this special day,but i swear it that once i'll get my hands on money i'll get you so much stuff. Just you wait until december you old lovable man!!!!",
        "Ok now onto the sentimental stuff. Because if there's something i love in this world it's writing you really really emotional stuff. And you have no escape. 1 year and 4 months ago i was lucky enough to meet you! It was such a crazy thing because if i never made that Flight Rising account,never went searching for friends,i wouldn't have met you. It blows my mind how something so small could have changed...everything. Because you are the most important person to me bro. As silly as it might sounds,you're the greatest friend i've ever had,and i enjoy your presence more than i have enjoyed anyones. You're funny,kind,smart,you're just a great dude to be around. And i'm not the type of person to hide that.",
        " You matter a lot to me so i'm not going to be scared about saying it. You make everything fun! You make every game we play together so much more enjoyable. Every time we hang out i have the best time,i feel like im a little kid again with you. You make me so much more hopeful and happy. And in all seriousness,i wouldn't be where i am now without you. Life hit me with tons of shit,especially this year. But i only got through it because you were there and you made me look up. Sure it was scary as shit going through a breakup after dating a girl for a year,but i wasn't alone at all. I had you bro. I had you to look forward to talking to,to play games,to joke and to ask for advice and opinions. That means a lot.",
        "Everyone that knows me also knows you bro,because everyone that knows me knows i love you a lot. Everyone i talk to,i always mention you. Whether its some funny memory,or a sweet one,or just talking about how i know about a thing because you like it. I'm very glad to be your bro. And i want to be your bro forever. Not like you'll get rid of me anyways i'm not letting you go. There's so much to thank you for. As i said,you were there for me during the best and the worst. I thank you for that. Getting to know you led me to also know myself better. If i didn't meet you i wouldn't have had the confidence i have now. I most likely wouldn't even have cut my hair short. But i had you cheering me on and seeing me for who i am.",
        "It's nothing unheard of,friendship matter a lot. And being around the right people can really change you for the better. And i'm glad i got to be around you bro. The world may be scary,but its way less scary with you here. Thank you for being there for me,for understanding. Really,if i was to sum it up,i want to thank you for being you. The you that puts smiles on others faces and makes everything better. The you that went through stressful situations but still had the courage to keep going. Thanks you for not giving up bro. Your existence matters and i hope you'll never forget that. Your bro surely won't! I'm so glad that i got to see who you were,who you are and who you'll become.",
        "We're still young,so there still so much to experience. And i'm happy that i'll get to experience it with you. Even if apart,i'll be glad to hear about what you accomplish. I'll be here all the way. So even when you'll be an old man,i'll be here cheering you on,joking and telling stories. Oh and of course cracking a beer open. In this whole world,there isn't a bro better than you. You're my bro for life. Thanks for sticking with me even tho i might be immature sometimes and...kinda stupid. I've grown a lot since i met you,and that's because you motivate me to grow. You're like my big brother. Actually i can just say you're my big brother. I don't want to dissapoint you.",
        "I'll always try my best,so at the end we can celebrate and have a beer. Or a burger. Or both! Truly there's such a bright future ahead of us. Glad i got to be here for one year and 4 months of your life bro. You've made me very proud in such a short amount of time. Cheer to this new age of new experiences! You were amazing at 18,sure as hell was at 19,and will be even cooler at 20. Keep being you bro. Keep shredding it everyday! Today,20 years ago,the coolest dude on this planet was born,and i'm so fucking glad he did. Because who else would i rather pester. You bro loves you lots!!! Have the best birthday ever,man. You deserve it. And you deserve everything that's good in this world. Happy birthday,Luke. Thanks for being."
    ];

 let currentLine = 0;
    let currentPage = 0;
    const textElement = document.getElementById('text');
    const nextButton = document.getElementById('next');
    const textThing = document.getElementById('textthing');
    const television = document.getElementById('television');
    const staticOverlay = document.getElementById('static');

    const dialogSound = new Audio('dialog-sound.mp3');
    const backgroundMusic = new Audio('tenna-theme.mp3');
    let audioReady = false;

    function highlightWords(text, highlightWordsArray) {
        if (!highlightWordsArray || highlightWordsArray.length === 0) return text;
        
        let result = text;
        
        highlightWordsArray.forEach(({ word, font }) => {
            const regex = new RegExp(`\\b${word}\\b`, 'gi');
            result = result.replace(regex, `<span class="${font}">${word}</span>`);
        });
        
        return result;
    }

    function startBackgroundMusic() {
        backgroundMusic.loop = true;
        backgroundMusic.volume = 0.2;
        backgroundMusic.play().catch(e => {
            console.log('Background music failed to start automatically');
        });
    }

    function playDialogSound() {
        dialogSound.volume = 0.2;
        dialogSound.currentTime = 0;
        dialogSound.play().catch(e => console.log('Audio play failed'));
    }

    function playInitialSounds() {
        playDialogSound();
        startBackgroundMusic();
        audioReady = true;
    }

    function startTVStatic() {
        staticOverlay.style.display = 'block';
        
        setTimeout(() => {
            staticOverlay.style.opacity = '0';
            setTimeout(() => {
                staticOverlay.style.display = 'none';
                
                playInitialSounds();
                
                const firstDialog = dialog[0];
                const initialText = highlightWords(firstDialog.text, firstDialog.highlightWords);
                textElement.innerHTML = initialText;
                document.getElementById(firstDialog.spriteId).classList.add('active');
            }, 1000);
        }, 4000);
    }

    function nextDialog() {
        const currentSpriteId = dialog[currentLine].spriteId;
        document.getElementById(currentSpriteId).classList.remove('active');
        
        currentLine++;
        
        if (currentLine < dialog.length) {
            const currentDialog = dialog[currentLine];
            const highlightedText = highlightWords(currentDialog.text, currentDialog.highlightWords);
            textElement.innerHTML = highlightedText;
            const newSpriteId = currentDialog.spriteId;
            document.getElementById(newSpriteId).classList.add('active');
            
            playDialogSound();
        } else {
            startTVTextMode();
        }
    }

    function startTVTextMode() {
        textThing.style.display = 'none';
        nextButton.style.display = 'none';
        
        television.classList.add('tv-fullscreen');

        document.querySelectorAll('.sprite').forEach(sprite => {
            sprite.style.display = 'none';
        });

        const tvTextContainer = document.createElement('div');
        tvTextContainer.className = 'tv-text-container';
        tvTextContainer.innerHTML = `<div class="tv-text">${tvTextPages[0]}</div>`;
        document.body.appendChild(tvTextContainer);

        const tvNextButton = document.createElement('button');
        tvNextButton.className = 'tv-next';
        tvNextButton.innerHTML = '<img src="https://i.ibb.co/xqtSr8hF/hgfhgfhgfhgf.png" alt="Next">';
        document.body.appendChild(tvNextButton);
        
        tvNextButton.addEventListener('click', nextTVPage);
    }

    function nextTVPage() {
        currentPage++;
    
        if (currentPage < tvTextPages.length) {
            document.querySelector('.tv-text').textContent = tvTextPages[currentPage];
        } else {
            document.querySelector('.tv-text-container').style.display = 'none';
            document.querySelector('.tv-next').style.display = 'none';
        }
    }

    window.addEventListener('load', function() {
        startTVStatic();
    });

    nextButton.addEventListener('click', nextDialog);

</script>

</body>
</html>
